# ──────────────────────────────────────────────────
#  POULTRYGUARD AI — Netlify Configuration
# ──────────────────────────────────────────────────

[build]
  # Vite outputs to dist/
  command = "npm run build"
  publish = "dist"
  # Netlify Functions directory
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Netlify Functions settings ────────────────────
[functions]
  node_bundler = "esbuild"

# ── SPA fallback for client-side routing ──────────
# All non-file, non-API requests fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Headers: Cache control for assets ─────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
